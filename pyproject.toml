[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "webrecon"
description = "Web application reconnaissance and security misconfiguration scanner (IT 359 Team Red)"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
webrecon = "webrecon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webrecon.__version__" }

[tool.setuptools.packages.find]
include = ["webrecon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
